<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Customizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Integration Customizer</h1>
            <p class="subtitle">Load an integration definition, customize it for your vendor, and export the final JSON.</p>
        </header>

        <div class="file-selector">
            <div class="selector-group">
                <label for="categorySelect">Category:</label>
                <select id="categorySelect">
                    <option value="assessment_tools">Assessment Tools</option>
                </select>
            </div>
            <div class="selector-group">
                <label for="instructorSelect">Choose an integration JSON:</label>
                <select id="instructorSelect">
                    <option value="">-- Select a file --</option>
                </select>
                <button id="loadBtn" class="btn primary">Load</button>
            </div>
            <div class="selector-group">
                <span class="or-text">or</span>
                <label class="upload-label" for="fileInput">Upload Custom JSON</label>
                <input type="file" id="fileInput" accept=".json">
            </div>
        </div>

        <div id="statusMessage" class="status-message hidden"></div>

        <div id="contentContainer" class="content hidden">
            <div class="step-indicator" id="stepIndicator"></div>

            <div id="sectionsContainer">
            </div>

            <div class="nav-buttons">
                <button class="nav-btn secondary" id="prevBtn" disabled>Previous</button>
                <button class="nav-btn primary" id="nextBtn">Next</button>
            </div>
        </div>

        <div id="emptyState" class="empty-state">
            <div class="icon"></div>
            <h3>No Integration Loaded</h3>
            <p>Select a file from the dropdown or upload a custom JSON to get started.</p>
        </div>
    </div>

    <script src="js/parser.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/dynamic-form.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
